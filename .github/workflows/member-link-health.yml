name: Check changed member links

on:
  pull_request:
    paths:
      - 'members/**.json'
      - 'scripts/check-member-links.js'
      - 'scripts/member-health.js'

permissions:
  contents: read

jobs:
  check-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Check new and changed member files
        shell: bash
        run: |
          mapfile -t member_files < <(
            git diff --name-only --diff-filter=AM \
              '${{ github.event.pull_request.base.sha }}' \
              '${{ github.event.pull_request.head.sha }}' \
              -- 'members/*.json'
          )
          if (( ${#member_files[@]} == 0 )); then
            echo 'No added or modified member files to check.'
            exit 0
          fi
          npm run members:health -- \
            --no-state \
            --failure-threshold 1 \
            "${member_files[@]}"
