name: Check changed member links

on:
  pull_request:
    paths:
      - 'members/**.json'
      - 'scripts/check-member-links.js'
      - 'scripts/member-health.js'

permissions:
  contents: read

jobs:
  check-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Check new and changed member files
        shell: bash
        run: |
          mapfile -t member_files < <(
            git diff --name-only --diff-filter=AM \
              '${{ github.event.pull_request.base.sha }}' \
              '${{ github.event.pull_request.head.sha }}' \
              -- 'members/*.json'
          )
          if (( ${#member_files[@]} == 0 )); then
            echo 'No added or modified member files to check.'
            exit 0
          fi
          npm run members:health -- \
            --no-state \
            --failure-threshold 1 \
            "${member_files[@]}"
