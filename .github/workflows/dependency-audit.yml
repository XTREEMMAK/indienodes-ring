# Known-vulnerability and provenance check for the npm dependency tree. It runs
# weekly and on PRs that touch package.json or the lockfile, and is deliberately
# NOT a general PR gate: an advisory published against an unrelated transitive
# dependency must not block a member submission. Treat a failure here as an
# alert to triage, not as a reason to merge around.
#
# `npm audit signatures` verifies registry signatures and provenance
# attestations for everything in the lockfile, which covers tampered or
# unexpected packages; `npm audit` covers known-vulnerable versions.

name: Dependency audit

on:
  schedule:
    - cron: '17 6 * * 1'
  pull_request:
    paths:
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm audit signatures
      - run: npm audit --audit-level=high
