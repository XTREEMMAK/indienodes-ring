# Publishes ring.json and both schemas to GitHub Pages, at ring.indienodes.us.
#
# This is the canonical public endpoint -- the whole reason this repo exists
# separately from indienodes-app. Deploying here is deliberately decoupled
# from that app's own Docker image build: docker-publish.yml there triggers
# on every push to main with no path filter, so today a member joining still
# rebuilds and republishes the entire web app. Nothing in this workflow talks
# to that pipeline at all, which is the point.
#
# GitHub Pages serves `access-control-allow-origin: *` on every response
# unconditionally (verified live against a real Pages site before this was
# written, not assumed from docs) -- so the widget's cross-origin fetch works
# with no CORS configuration here.
#
# Only the static landing page, ring.json, and schema/ are published, not the
# whole repo: members/, scripts/, and docs/ are source and tooling, not the
# public artifact.
#
# Path-filtered like build-ring.yml and validate-ring.yml: a docs-only or
# script-only push has nothing new to publish.

name: Publish to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'ring.json'
      - 'schema/**'
      - 'site/**'
      - '.github/workflows/publish-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Assemble the published site
        run: |
          mkdir -p _site/schema
          cp -R site/. _site/
          cp ring.json _site/ring.json
          cp schema/ring.schema.json _site/schema/ring-entry.json
          cp schema/ring-document.schema.json _site/schema/ring-document.json
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5

      # Tells indienodes-app to refresh its own committed ring.json mirror
      # now, rather than waiting for that repo's own twice-daily fallback
      # schedule (sync-ring.yml there). Needs write access to that repo to
      # fire a dispatch, so a token scoped to *this* repo (RING_BUILD_PAT)
      # cannot be reused here -- see APP_DISPATCH_PAT in this repo's own
      # secrets. Not fatal if this step is ever skipped or fails: the
      # fallback schedule on the other end still catches it within hours.
      - name: Notify indienodes-app to refresh its mirror
        if: steps.deployment.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.APP_DISPATCH_PAT }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "APP_DISPATCH_PAT is not set; skipping. indienodes-app will pick this up on its next scheduled sync instead." >&2
            exit 0
          fi
          gh api --method POST /repos/XTREEMMAK/indienodes-app/dispatches \
            -f event_type=ring-updated
