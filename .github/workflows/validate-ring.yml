# Gates any PR that touches ring.json or the schema/validator that defines
# what "valid" means on `npm run validate:publish`. Member-only PRs are
# deliberately not an initial trigger: build-ring.yml first formats the member
# source and commits the regenerated ring.json, whose synchronize event then
# starts this check against the complete artifact. Triggering on the member-only
# commit made every automated submission fail once, email the maintainer, then
# pass seconds later after the builder's commit.
#
# Separate from
# docker-publish.yml on purpose: that workflow is a multi-arch buildx job
# scoped to build/push, and bundling this in would make every ring.json-only
# PR wait on an unrelated Docker matrix.
#
# This check has to be marked "required" in the repo's branch protection
# settings for main (Settings > Branches) for it to actually block a merge —
# that's a GitHub setting, not something this file can express.
#
# ring.json currently contains four seed entries marked `_placeholder: true`.
# Until launch cleanup, a PR matching these paths must remove or replace every
# placeholder to pass. This is intentional; do not replace the publish check
# with the shape-only `npm run validate` command.

name: Validate ring.json

on:
  pull_request:
    paths:
      - 'ring.json'
      - 'schema/ring.schema.json'
      - 'scripts/build-ring.js'
      - 'scripts/ring-files.js'
      - 'scripts/validate-ring.js'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run validate:publish
